<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="img/favicon-32x32.png">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="meio">
        <img src="/SA01/imgs/image.png" alt="logo" class="logo">

        <h2>Cadastro de Usuário</h2>

        <form>
            <!-- campo para o nome do usuário -->
            <input type="text" id="nome" placeholder="Digite seu nome">
            <br><br>

            <!-- campo para o email do usuário -->
            <input type="text" id="email" placeholder="Digite seu email">
            <br><br>

            <!-- campo de senha com indicador de força -->
            <div class="senha1">
                <i class="bi bi-eye-fill icone" id="botaoSenha"></i>
                <input type="password" id="senha" placeholder="Digite sua senha"><br>
                <!-- mostra a força da senha em tempo real -->
                <p id="forca-senha"></p>
            </div>

            <!-- campo de confirmação de senha -->
            <div class="senha2">
                <i class="bi bi-eye-fill icone" id="botaoSenha2"></i>
                <input type="password" id="confirmar-senha" placeholder="Confirme sua senha"><br><br>
            </div>

            <!-- container para múltiplos telefones -->
            <div id="telefones-container">
                <!-- primeiro campo de telefone é adicionado por padrão e não pode ser deletado -->
                <div class="telefone-item">
                    <input type="text" class="telefone" placeholder="Digite seu telefone">
                </div>
            </div>
            <!-- botão para adicionar mais telefones -->
            <button type="button" id="adicionar-telefone" class="btn-adicionar">Adicionar Telefone</button>
            <br><br>

            <button type="button" id="cadastrar" class="cadastrar">Cadastrar</button>

            <!-- mensagem de erro ou sucesso após a validação -->
            <p id="mensagem"></p>

            <!-- exibe os dados do último usuário cadastrado com sucesso -->
            <div id="usuario-salvo"></div>

        </form>
    </div>

    <script src="script.js"></script>




</body>

</html>

<!DOCTYPE html> <html lang="pt-br"> <head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eventou</title>

<link rel="stylesheet" href="style.css">

</head> <body>
<header>

    <h1>Eventou</h1>

    <nav>
        <a href="#inicio">Início</a>
    </nav>

</header>



<main>


    <section id="inicio" class="inicio">

        <h2>Encontre eventos na sua cidade</h2>

        <p>
            Digite uma cidade para encontrar eventos.
        </p>


        <form id="formBusca">

            <input
                type="text"
                id="cidade"
                placeholder="Digite uma cidade"
                required
            >

            <button type="submit">
                Pesquisar
            </button>

        </form>

    </section>



    <section class="eventos">

        <p id="carregando"></p>

        <div id="listaEventos">
        </div>

    </section>



    <section class="sobre">

        <h2>Sobre o Eventou</h2>

        <p>
            O Eventou é um site que ajuda você a encontrar
            eventos em diferentes cidades.
        </p>

    </section>


</main>



<footer>

    <p>Eventou - 2026</p>

</footer>


<script src="script.js"></script>

</body> </html>
